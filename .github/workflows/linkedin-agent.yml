name: LinkedIn Job Agent

on:
  # GitHub checks hourly; the Neon-backed guard starts a scan only after 10 hours.
  schedule:
    - cron: "17 * * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Run now even if the 10-hour interval has not elapsed"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: linkedin-job-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # Keep skipped hourly checks cheap: only install the PostgreSQL driver before the gate.
      - name: Install database driver for schedule check
        run: python -m pip install "psycopg[binary]==3.3.6"

      - name: Check whether a scan is due
        id: guard
        env:
          FORCE_RUN: ${{ inputs.force_run }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$FORCE_RUN" == "true" ]]; then
            python scripts/schedule_guard.py --force
          else
            python scripts/schedule_guard.py
          fi

      - name: Install agent dependencies
        if: steps.guard.outputs.run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Verify resume is available
        if: steps.guard.outputs.run == 'true'
        run: test -s data/resume.pdf

      - name: Run one agent scan
        if: steps.guard.outputs.run == 'true'
        run: python main.py --once --skip-schedule-check

      - name: Reset schedule claim if the workflow failed
        if: failure() && steps.guard.outputs.run == 'true'
        run: python scripts/schedule_guard.py --reset
